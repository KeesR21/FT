# Local databases for development. Start: docker compose up -d
#
# MongoDB (recommended local dev):
#   MONGODB_URI=mongodb://127.0.0.1:27017/ftpr-lions
#   USE_MOCK_DB=false
#   npm run db:compose:mongodb && npm run db:verify:mongodb
#
# MySQL (matches Hostinger):
#   DATABASE_URL=mysql://academy:academy@127.0.0.1:3306/academy
#   npm run db:setup:mysql
#
# PostgreSQL (optional):
#   DATABASE_URL=postgresql://academy:academy@127.0.0.1:5432/academy
#   npm run db:setup

services:
  mongodb:
    image: mongo:7
    container_name: ftpr-academy-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ftpr_academy_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4
    container_name: ftpr-academy-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: academy
      MYSQL_USER: academy
      MYSQL_PASSWORD: academy
    ports:
      - "3306:3306"
    volumes:
      - ftpr_academy_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uacademy", "-pacademy"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: ftpr-academy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: academy
      POSTGRES_PASSWORD: academy
      POSTGRES_DB: academy
    ports:
      - "5432:5432"
    volumes:
      - ftpr_academy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academy -d academy"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ftpr_academy_mongo:
  ftpr_academy_mysql:
  ftpr_academy_pgdata:
